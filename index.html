<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>H&B Peek-A-Boos &copy;</title>

<style>

body{
margin:0;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

/* ---------- Intro ---------- */

#intro{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:1000;
transition:opacity 0.8s ease;
}

#intro img{
width:800px;
max-width:95vw;
}

/* ---------- Container ---------- */

#container{
position:relative;
width:800px;
max-width:95vw;
opacity:0;
touch-action:manipulation;
cursor:pointer;
}

/* Perfect stacking */

.layer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:contain;
}

/* Visibility */

.hidden{ opacity:0; }
.visible{ opacity:1; transition:opacity 0.35s ease; }

/* ---------- Shake ---------- */

@keyframes shake{
0%{transform:translate(0,0);}
25%{transform:translate(-6px,4px);}
50%{transform:translate(6px,-4px);}
75%{transform:translate(-4px,-6px);}
100%{transform:translate(0,0);}
}

.shake{
animation:shake 0.35s;
}

</style>
</head>

<body>

<!-- Intro -->

<div id="intro">
<img src="https://ipfs.io/ipfs/bafybeigishjmv62vn2nsnzdnfuvz5437jj7qomzxvzwqrbb4me25qgxr3m">
</div>

<!-- App -->

<div id="container">

<img id="background" class="layer">
<img id="overlay2" class="layer">
<img id="overlay" class="layer">

</div>

<script>

/* -----------------------------
IPFS CONFIG
----------------------------- */

const backgrounds=[
"https://ipfs.io/ipfs/bafybeiaqox3qexkwmrwlaq4aps6preyj6xsdv5g5i5mtnp36x25zju3wpm"
]

const overlayCID="https://ipfs.io/ipfs/bafybeie6dd7iq4ajvfvhybbgppom5txmzmz5duo7h27576e5jinpads2ie"
const overlay2CID="https://ipfs.io/ipfs/bafybeihqcfgnw4a2ef3ja4svibqxoijbtncnsa5ri6mcomts7cpsckguea"

/* -----------------------------
ELEMENTS
----------------------------- */

const bg=document.getElementById("background")
const overlay=document.getElementById("overlay")
const overlay2=document.getElementById("overlay2")
const container=document.getElementById("container")

/* -----------------------------
LOAD (MATCHES ORIGINAL LOGIC)
----------------------------- */

let loaded=0

function checkLoaded(){

loaded++

if(loaded>=3){

setTimeout(()=>{

document.getElementById("intro").style.opacity=0
container.style.opacity=1

setTimeout(()=>{
document.getElementById("intro").remove()
},500)

setState("overlay")

},800)

}
}

bg.onload=checkLoaded
overlay.onload=checkLoaded
overlay2.onload=checkLoaded

/* Assign sources AFTER binding onload */

bg.src=backgrounds[Math.floor(Math.random()*backgrounds.length)]
overlay.src=overlayCID
overlay2.src=overlay2CID

/* -----------------------------
STATE MACHINE
----------------------------- */

let state="overlay"
let idleTimer=null

function setState(newState){

state=newState
clearTimeout(idleTimer)

/* Hide all */
overlay.classList.add("hidden")
overlay2.classList.add("hidden")
bg.classList.add("hidden")

/* Show current */
if(state==="overlay"){
overlay.classList.remove("hidden")
}

if(state==="overlay2"){
overlay2.classList.remove("hidden")
idleTimer=setTimeout(()=>setState("overlay"),7000)
}

if(state==="background"){
bg.classList.remove("hidden")
idleTimer=setTimeout(()=>setState("overlay"),15000)
}

}

/* -----------------------------
FEEDBACK
----------------------------- */

function feedback(){

container.classList.remove("shake")
void container.offsetWidth
container.classList.add("shake")

if(navigator.vibrate){
navigator.vibrate(60)
}

}

/* -----------------------------
TAP HANDLING (FIXED)
----------------------------- */

let tapTimeout=null
let lastTap=0

container.addEventListener("pointerdown",()=>{

const now=Date.now()
const delta=now-lastTap

if(delta<280){
clearTimeout(tapTimeout)
handleDoubleTap()
}else{
tapTimeout=setTimeout(()=>{
handleSingleTap()
},250)
}

lastTap=now

})

function handleSingleTap(){

if(state==="overlay"){
feedback()
setState("overlay2")
}

}

function handleDoubleTap(){

if(state==="overlay2"){
feedback()
setState("background")
}
else if(state==="background"){
feedback()
setState("overlay")
}

}

</script>

</body>
</html>
