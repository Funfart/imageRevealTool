<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>H&B Peek-A-Boos &copy;</title>

<style>

body{
margin:0;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
font-family:sans-serif;
}

/* ---------- Intro ---------- */

#intro{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:1000;
transition:opacity 0.8s ease;
}

#intro img{
width:800px;
max-width:95vw;
}

/* ---------- Container ---------- */

#container{
position:relative;
width:800px;
max-width:95vw;
opacity:0;
touch-action:manipulation;
cursor:pointer;
}

/* Images */

img{
width:100%;
display:block;
pointer-events:none;
position:absolute;
top:0;
left:0;
}

/* Layering */

#background{ z-index:1; }
#overlay{ z-index:3; }
#overlay2{ z-index:2; }

/* Visibility */

.hidden{ opacity:0; }
.visible{ opacity:1; transition:opacity 0.4s ease; }

/* ---------- Shake Animation ---------- */

@keyframes shake {
0% { transform:translate(0,0); }
20% { transform:translate(-5px,5px); }
40% { transform:translate(5px,-5px); }
60% { transform:translate(-5px,-5px); }
80% { transform:translate(5px,5px); }
100% { transform:translate(0,0); }
}

.shake{
animation:shake 0.4s;
}

</style>
</head>

<body>

<!-- Intro -->

<div id="intro">
<img src="https://ipfs.io/ipfs/bafybeigishjmv62vn2nsnzdnfuvz5437jj7qomzxvzwqrbb4me25qgxr3m">
</div>

<!-- App -->

<div id="container">

<img id="background">
<img id="overlay">
<img id="overlay2">

</div>

<script>

/* -----------------------------
IPFS CONFIG
----------------------------- */

const backgrounds=[
"https://ipfs.io/ipfs/bafybeiaqox3qexkwmrwlaq4aps6preyj6xsdv5g5i5mtnp36x25zju3wpm"
]

const overlayCID="https://ipfs.io/ipfs/bafybeie6dd7iq4ajvfvhybbgppom5txmzmz5duo7h27576e5jinpads2ie"

const overlay2CID="https://ipfs.io/ipfs/bafybeihqcfgnw4a2ef3ja4svibqxoijbtncnsa5ri6mcomts7cpsckguea"

/* -----------------------------
ELEMENTS
----------------------------- */

const bg=document.getElementById("background")
const overlay=document.getElementById("overlay")
const overlay2=document.getElementById("overlay2")
const container=document.getElementById("container")

/* -----------------------------
LOAD
----------------------------- */

bg.src=backgrounds[Math.floor(Math.random()*backgrounds.length)]
overlay.src=overlayCID
overlay2.src=overlay2CID

let loaded=0

function checkLoaded(){
loaded++
if(loaded>=3){

setTimeout(()=>{

document.getElementById("intro").style.opacity=0
container.style.opacity=1

setTimeout(()=>document.getElementById("intro").remove(),500)

setState("overlay")

},800)

}
}

bg.onload=checkLoaded
overlay.onload=checkLoaded
overlay2.onload=checkLoaded

/* -----------------------------
STATE SYSTEM
----------------------------- */

let state="overlay"
let idleTimer=null

function setState(newState){

state=newState
resetIdle()

overlay.classList.add("hidden")
overlay2.classList.add("hidden")
bg.classList.add("hidden")

if(state==="overlay"){
overlay.classList.remove("hidden")
}

if(state==="overlay2"){
overlay2.classList.remove("hidden")
startIdle(7000, ()=>setState("overlay"))
}

if(state==="background"){
bg.classList.remove("hidden")
startIdle(15000, ()=>setState("overlay"))
}

}

/* -----------------------------
IDLE TIMER
----------------------------- */

function startIdle(time,callback){
clearTimeout(idleTimer)
idleTimer=setTimeout(callback,time)
}

function resetIdle(){
clearTimeout(idleTimer)
}

/* -----------------------------
SHAKE + HAPTIC
----------------------------- */

function triggerFeedback(){

container.classList.remove("shake")
void container.offsetWidth
container.classList.add("shake")

if(navigator.vibrate){
navigator.vibrate(60)
}

}

/* -----------------------------
INPUT HANDLING
----------------------------- */

let lastTap=0

container.addEventListener("pointerdown",()=>{

const now=Date.now()
const delta=now-lastTap

if(delta<300){
handleDoubleTap()
}else{
handleSingleTap()
}

lastTap=now

})

function handleSingleTap(){

if(state==="overlay"){
triggerFeedback()
setState("overlay2")
}

}

function handleDoubleTap(){

if(state==="overlay2"){
triggerFeedback()
setState("background")
}

else if(state==="background"){
triggerFeedback()
setState("overlay")
}

}

</script>

</body>
</html>
