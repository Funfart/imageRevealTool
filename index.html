<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>H&B Peek-A-Boos &copy;</title>

<style>

body{
margin:0;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:sans-serif;
overflow:hidden;
}

/* ---------- Splash Intro ---------- */

#intro{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:1000;
transition:opacity 0.8s ease;
}

#intro img{
width:800px;
max-width:95vw;
filter:drop-shadow(0 0 30px rgba(255,255,255,0.2));
}

/* ---------- App ---------- */

#container{
position:relative;
width:800px;
max-width:95vw;
opacity:0;
touch-action:manipulation;
cursor:pointer;
}

/* Base images */

img{
width:100%;
display:block;
pointer-events:none;
}

/* Overlay sits on top */

#overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
transition:opacity 0.4s ease;
}

</style>
</head>

<body>

<!-- Splash Intro -->

<div id="intro">
<img src="https://ipfs.io/ipfs/bafybeigishjmv62vn2nsnzdnfuvz5437jj7qomzxvzwqrbb4me25qgxr3m">
</div>

<!-- Main Container -->

<div id="container">

<img id="background">
<img id="overlay">

</div>

<script>

/* -----------------------------
IPFS CONFIG
----------------------------- */

const backgrounds=[
"https://ipfs.io/ipfs/bafybeiaqox3qexkwmrwlaq4aps6preyj6xsdv5g5i5mtnp36x25zju3wpm"
]

const overlayCID="https://ipfs.io/ipfs/bafybeie6dd7iq4ajvfvhybbgppom5txmzmz5duo7h27576e5jinpads2ie"

/* -----------------------------
Load Assets
----------------------------- */

const bg=document.getElementById("background")
const overlay=document.getElementById("overlay")

bg.src=backgrounds[Math.floor(Math.random()*backgrounds.length)]
overlay.src=overlayCID

let loaded=0

function checkLoaded(){
loaded++
if(loaded>=2){

setTimeout(()=>{

document.getElementById("intro").style.opacity=0
document.getElementById("container").style.opacity=1

setTimeout(()=>{
document.getElementById("intro").remove()
},500)

},800)

}
}

bg.onload=checkLoaded
overlay.onload=checkLoaded

/* -----------------------------
Tap / Click Reveal Toggle
----------------------------- */

let revealed=false

document.getElementById("container").addEventListener("pointerdown",()=>{

revealed=!revealed

overlay.style.opacity = revealed ? "0" : "1"

})

</script>

</body>
</html>
