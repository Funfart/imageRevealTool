<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>H&B Conversion Pod &copy;</title>

<style>

body{
margin:0;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

/* ---------- Intro ---------- */

#intro{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:1000;
transition:opacity 0.8s ease;
}

#intro img{
width:800px;
max-width:95vw;
}

/* ---------- Container ---------- */

#container{
position:relative;
width:800px;
max-width:95vw;
opacity:0;
cursor:pointer;
}

/* Background */

#background{
width:100%;
display:block;
position:relative;
z-index:1;
}

/* Layers */

.layer{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:contain;
z-index:2;
}

/* Visibility */

.hidden{
opacity:0;
pointer-events:none;
}

/* Tap Shake */

@keyframes shake{
0%{transform:translate(0);}
25%{transform:translate(-6px,4px);}
50%{transform:translate(6px,-4px);}
75%{transform:translate(-4px,-6px);}
100%{transform:translate(0);}
}

.shake{
animation:shake 0.25s;
}

/* 🔥 Background ambient shake */

@keyframes bgShake{
0%{transform:translate(0);}
25%{transform:translate(-2px,1px);}
50%{transform:translate(2px,-1px);}
75%{transform:translate(-1px,-2px);}
100%{transform:translate(0);}
}

.bg-shake{
animation:bgShake 1.2s infinite;
}

</style>
</head>

<body>

<div id="intro">
<img src="https://ipfs.io/ipfs/bafybeigishjmv62vn2nsnzdnfuvz5437jj7qomzxvzwqrbb4me25qgxr3m">
</div>

<div id="container">

<img id="background">
<img id="overlay2" class="layer">
<img id="overlay" class="layer">

</div>

<script>

/* -----------------------------
CONFIG
----------------------------- */

const backgrounds=[
"https://ipfs.io/ipfs/bafybeife4qi4eiwbiiefjvsclzbynqyysg4zmf4q4t65sc64tbri5hbjji"
]

const overlayCID="https://ipfs.io/ipfs/bafybeibyizz6tlehmoxuoozqmiqzsbf7g57c6io7dpjfpubluo6bynkjdq"
const overlay2CID="https://ipfs.io/ipfs/bafybeiesanxrr5dpc3u3psqlqqqhptpujtjpicrswe6zxlussaxjowibt4"

/* -----------------------------
ELEMENTS
----------------------------- */

const bg=document.getElementById("background")
const overlay=document.getElementById("overlay")
const overlay2=document.getElementById("overlay2")
const container=document.getElementById("container")

/* -----------------------------
LOAD
----------------------------- */

let loaded=0

function checkLoaded(){
loaded++
if(loaded>=3){

setTimeout(()=>{

document.getElementById("intro").style.opacity=0
container.style.opacity=1

setTimeout(()=>document.getElementById("intro").remove(),500)

setState("overlay")

},800)

}
}

bg.onload=checkLoaded
overlay.onload=checkLoaded
overlay2.onload=checkLoaded

/* Load assets */

let selectedBG = backgrounds[Math.floor(Math.random()*backgrounds.length)]

bg.src = selectedBG
overlay.src = overlayCID
overlay2.src = overlay2CID

/* -----------------------------
STATE MACHINE
----------------------------- */

let state="overlay"
let idleTimer=null

function setState(newState){

state=newState
clearTimeout(idleTimer)

/* Reset all */
overlay.classList.add("hidden")
overlay2.classList.add("hidden")
bg.classList.remove("bg-shake")

if(state==="overlay"){
overlay.classList.remove("hidden")
}

if(state==="overlay2"){
overlay2.classList.remove("hidden")
idleTimer=setTimeout(()=>setState("overlay"),7000)
}

if(state==="background"){
restartGIF()

/* 🔥 ambient shake ON */
bg.classList.add("bg-shake")

idleTimer=setTimeout(()=>setState("overlay2"),15000)
}

}

/* -----------------------------
GIF RESTART
----------------------------- */

function restartGIF(){
bg.src=""
setTimeout(()=> bg.src = selectedBG, 30)
}

/* -----------------------------
FEEDBACK (tap only)
----------------------------- */

function feedback(){

container.classList.remove("shake")
void container.offsetWidth
container.classList.add("shake")

if(navigator.vibrate){
navigator.vibrate(60)
}

}

/* -----------------------------
INPUT
----------------------------- */

let tapTimeout=null
let lastTap=0

container.addEventListener("pointerdown",()=>{

const now=Date.now()
const delta=now-lastTap

if(delta<280){
clearTimeout(tapTimeout)
handleDoubleTap()
}else{
tapTimeout=setTimeout(handleSingleTap,250)
}

lastTap=now

})

function handleSingleTap(){
if(state==="overlay"){
feedback()
setState("overlay2")
}
}

function handleDoubleTap(){

if(state==="overlay2"){
feedback()
setState("background")
}
else if(state==="background"){
feedback()
setState("overlay")
}

}

</script>

</body>
</html>
