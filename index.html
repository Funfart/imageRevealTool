<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>H&B Peek-A-Boos &copy;</title>

<style>

body{
margin:0;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:sans-serif;
overflow:hidden;
}

/* ---------- Splash Intro ---------- */

#intro{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:1000;
transition:opacity 0.8s ease;
}

#intro img{
width:800px;
max-width:95vw;
filter:drop-shadow(0 0 30px rgba(255,255,255,0.2));
}

/* ---------- App ---------- */

#container{
position:relative;
width:800px;
max-width:95vw;
opacity:0;
touch-action:manipulation;
cursor:pointer;
}

/* Images */

img{
width:100%;
display:block;
pointer-events:none;
}

/* Overlay */

#overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
transition:opacity 0.4s ease;
}

/* ---------- Shake Animation ---------- */

@keyframes shake {
0% { transform: translate(0, 0); }
20% { transform: translate(-6px, 4px); }
40% { transform: translate(6px, -4px); }
60% { transform: translate(-4px, 2px); }
80% { transform: translate(4px, -2px); }
100% { transform: translate(0, 0); }
}

.shake{
animation: shake 0.35s ease;
}

</style>
</head>

<body>

<!-- Intro -->

<div id="intro">
<img src="https://ipfs.io/ipfs/bafybeigishjmv62vn2nsnzdnfuvz5437jj7qomzxvzwqrbb4me25qgxr3m">
</div>

<!-- App -->

<div id="container">

<img id="background">
<img id="overlay">

</div>

<script>

/* -----------------------------
IPFS CONFIG
----------------------------- */

const backgrounds=[
"https://ipfs.io/ipfs/bafybeiaqox3qexkwmrwlaq4aps6preyj6xsdv5g5i5mtnp36x25zju3wpm"
]

const overlayCID="https://ipfs.io/ipfs/bafybeie6dd7iq4ajvfvhybbgppom5txmzmz5duo7h27576e5jinpads2ie"

/* -----------------------------
Load Assets
----------------------------- */

const bg=document.getElementById("background")
const overlay=document.getElementById("overlay")
const container=document.getElementById("container")

bg.src=backgrounds[Math.floor(Math.random()*backgrounds.length)]
overlay.src=overlayCID

let loaded=0

function checkLoaded(){
loaded++
if(loaded>=2){

setTimeout(()=>{

document.getElementById("intro").style.opacity=0
container.style.opacity=1

setTimeout(()=>{
document.getElementById("intro").remove()
},500)

},800)

}
}

bg.onload=checkLoaded
overlay.onload=checkLoaded

/* -----------------------------
Double Tap Detection
----------------------------- */

let lastTap = 0
let revealed = false
const DOUBLE_TAP_DELAY = 300

container.addEventListener("pointerdown",(e)=>{

const now = Date.now()
const delta = now - lastTap

if(delta < DOUBLE_TAP_DELAY && delta > 0){

toggleReveal()

}

lastTap = now

})

/* -----------------------------
Toggle Reveal + Effects
----------------------------- */

function toggleReveal(){

revealed = !revealed

// Switch visibility
overlay.style.opacity = revealed ? "0" : "1"

// Shake effect
container.classList.remove("shake")
void container.offsetWidth // force reflow
container.classList.add("shake")

// Haptic feedback (mobile)
if(navigator.vibrate){
navigator.vibrate(40)
}

}

</script>

</body>
</html>
