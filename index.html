<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>H&B Peek-A-Boos &copy;</title>

<style>

body{
margin:0;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

/* ---------- Intro ---------- */

#intro{
position:fixed;
top:0;
left:0;
width:100vw;
height:100vh;
background:black;
display:flex;
justify-content:center;
align-items:center;
z-index:1000;
transition:opacity 0.8s ease;
}

#intro img{
width:800px;
max-width:95vw;
}

/* ---------- App ---------- */

#container{
position:relative;
width:800px;
max-width:95vw;
opacity:0;
cursor:pointer;
}

img{
width:100%;
display:block;
}

#overlayCanvas{
position:absolute;
top:0;
left:0;
}

/* ---------- Shake ---------- */

@keyframes shake{
0%{transform:translate(0,0);}
25%{transform:translate(-6px,4px);}
50%{transform:translate(6px,-4px);}
75%{transform:translate(-4px,-6px);}
100%{transform:translate(0,0);}
}

.shake{
animation:shake 0.35s;
}

</style>
</head>

<body>

<div id="intro">
<img src="https://ipfs.io/ipfs/bafybeigishjmv62vn2nsnzdnfuvz5437jj7qomzxvzwqrbb4me25qgxr3m">
</div>

<div id="container">

<img id="background">
<canvas id="overlayCanvas"></canvas>

</div>

<script>

/* -----------------------------
IPFS CONFIG
----------------------------- */

const backgrounds=[
//"https://ipfs.io/ipfs/bafybeiaqox3qexkwmrwlaq4aps6preyj6xsdv5g5i5mtnp36x25zju3wpm"
"https://ipfs.io/ipfs/bafybeife4qi4eiwbiiefjvsclzbynqyysg4zmf4q4t65sc64tbri5hbjji"
]

const overlayCID="https://ipfs.io/ipfs/bafybeibyizz6tlehmoxuoozqmiqzsbf7g57c6io7dpjfpubluo6bynkjdq"
//const overlayCID="https://ipfs.io/ipfs/bafybeie6dd7iq4ajvfvhybbgppom5txmzmz5duo7h27576e5jinpads2ie"(gif)
const overlay2CID="https://ipfs.io/ipfs/bafybeihqcfgnw4a2ef3ja4svibqxoijbtncnsa5ri6mcomts7cpsckguea"

/* -----------------------------
ELEMENTS
----------------------------- */

const bg=document.getElementById("background")
const canvas=document.getElementById("overlayCanvas")
const ctx=canvas.getContext("2d")
const container=document.getElementById("container")

/* -----------------------------
IMAGES
----------------------------- */

const overlayImg=new Image()
const overlay2Img=new Image()

/* -----------------------------
LOAD
----------------------------- */

let loaded=0

function checkLoaded(){

loaded++

if(loaded>=3){

setTimeout(()=>{

document.getElementById("intro").style.opacity=0
container.style.opacity=1

setTimeout(()=>document.getElementById("intro").remove(),500)

resizeCanvas()
setState("overlay")

},800)

}
}

bg.onload=checkLoaded
overlayImg.onload=checkLoaded
overlay2Img.onload=checkLoaded

bg.src=backgrounds[Math.floor(Math.random()*backgrounds.length)]
overlayImg.src=overlayCID
overlay2Img.src=overlay2CID

/* -----------------------------
CANVAS
----------------------------- */

function resizeCanvas(){

canvas.width=bg.clientWidth
canvas.height=bg.clientHeight

draw()

}

window.addEventListener("resize",resizeCanvas)

/* -----------------------------
STATE MACHINE
----------------------------- */

let state="overlay"
let idleTimer=null

function setState(newState){

state=newState
clearTimeout(idleTimer)

if(state==="overlay2"){
idleTimer=setTimeout(()=>setState("overlay"),7000)
}

if(state==="background"){
idleTimer=setTimeout(()=>setState("overlay"),15000)
}

draw()

}

/* -----------------------------
DRAW
----------------------------- */

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

/* Draw overlay states only */

if(state==="overlay"){
ctx.drawImage(overlayImg,0,0,canvas.width,canvas.height)
}

if(state==="overlay2"){
ctx.drawImage(overlay2Img,0,0,canvas.width,canvas.height)
}

/* background = nothing drawn (reveals base image) */

}

/* -----------------------------
FEEDBACK
----------------------------- */

function feedback(){

container.classList.remove("shake")
void container.offsetWidth
container.classList.add("shake")

if(navigator.vibrate){
navigator.vibrate(60)
}

}

/* -----------------------------
TAP HANDLING
----------------------------- */

let tapTimeout=null
let lastTap=0

container.addEventListener("pointerdown",()=>{

const now=Date.now()
const delta=now-lastTap

if(delta<280){
clearTimeout(tapTimeout)
handleDoubleTap()
}else{
tapTimeout=setTimeout(handleSingleTap,250)
}

lastTap=now

})

function handleSingleTap(){

if(state==="overlay"){
feedback()
setState("overlay2")
}

}

function handleDoubleTap(){

if(state==="overlay2"){
feedback()
setState("background")
}
else if(state==="background"){
feedback()
setState("overlay")
}

}

</script>

</body>
</html>
